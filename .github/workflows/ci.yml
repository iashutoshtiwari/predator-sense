name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Python compile check
        run: python -m compileall -q src scripts

      - name: Hardware-free behavioral tests
        env:
          PYTHONPATH: src
          QT_QPA_PLATFORM: offscreen
        run: |
          command -v dbus-daemon
          python -m unittest discover -s tests -v

      - name: Repo smoke test
        run: python scripts/smoke_test.py

      - name: PKGBUILD sanity check
        run: |
          test -f PKGBUILD
          grep -q "^pkgname=predator-sense" PKGBUILD


      - name: Wheel contents and entry points
        run: |
          python -m build --wheel --no-isolation
          python scripts/check_wheel.py dist/*.whl

  arch-package:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4
      - name: Build without installing or starting services
        run: |
          pacman -Syu --noconfirm python python-build python-installer python-setuptools
          useradd -m builder
          chown -R builder:builder .
          runuser -u builder -- python scripts/prepare_arch_source.py
          runuser -u builder -- bash -c 'makepkg --printsrcinfo > .SRCINFO'
          runuser -u builder -- makepkg --nodeps --nocheck --noconfirm
          bsdtar -tf predator-sense-*.pkg.tar.zst

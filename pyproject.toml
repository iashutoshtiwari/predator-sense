[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F"]

[tool.ruff.lint.per-file-ignores]
"src/predator_sense/frontend.py" = ["E501"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "predator-sense"
version = "1.0.0"
description = "Native G3-572 fan control and telemetry for Arch Linux"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = ["PyQt6>=6.6", "dbus-next>=0.2.3"]

[project.optional-dependencies]
nvidia = ["nvidia-ml-py"]

[project.scripts]
predator-sense = "predator_sense.main:main"
predator-sensed = "predator_sense.daemon_main:main"
predator-sense-check = "predator_sense.install_check:main"
predator-sense-diagnostics = "predator_sense.diagnostics:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
predator_sense = ["assets/*.svg", "assets/*.png", "assets/fonts/*.ttf", "assets/fonts/*.txt"]

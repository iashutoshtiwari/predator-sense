<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy context="default">
    <deny own="io.github.iashutoshtiwari.PredatorSense"/>
    <deny send_destination="io.github.iashutoshtiwari.PredatorSense"/>
    <!-- Only these methods are routable. Every mutation also requires daemon-side Polkit authorization. -->
    <allow send_destination="io.github.iashutoshtiwari.PredatorSense" send_interface="io.github.iashutoshtiwari.PredatorSense.Control" send_member="GetHardwareIdentity"/>
    <allow send_destination="io.github.iashutoshtiwari.PredatorSense" send_interface="io.github.iashutoshtiwari.PredatorSense.Control" send_member="GetStatus"/>
    <allow send_destination="io.github.iashutoshtiwari.PredatorSense" send_interface="io.github.iashutoshtiwari.PredatorSense.Control" send_member="GetTelemetrySnapshot"/>
    <allow send_destination="io.github.iashutoshtiwari.PredatorSense" send_interface="io.github.iashutoshtiwari.PredatorSense.Control" send_member="GetFanState"/>
    <allow send_destination="io.github.iashutoshtiwari.PredatorSense" send_interface="io.github.iashutoshtiwari.PredatorSense.Control" send_member="GetCoolBoost"/>
    <allow send_destination="io.github.iashutoshtiwari.PredatorSense" send_interface="io.github.iashutoshtiwari.PredatorSense.Control" send_member="GetTemperatures"/>
    <allow send_destination="io.github.iashutoshtiwari.PredatorSense" send_interface="io.github.iashutoshtiwari.PredatorSense.Control" send_member="GetFanSpeeds"/>
    <allow send_destination="io.github.iashutoshtiwari.PredatorSense" send_interface="io.github.iashutoshtiwari.PredatorSense.Control" send_member="SetCpuFanMode"/>
    <allow send_destination="io.github.iashutoshtiwari.PredatorSense" send_interface="io.github.iashutoshtiwari.PredatorSense.Control" send_member="SetGpuFanMode"/>
    <allow send_destination="io.github.iashutoshtiwari.PredatorSense" send_interface="io.github.iashutoshtiwari.PredatorSense.Control" send_member="SetCpuManualSpeed"/>
    <allow send_destination="io.github.iashutoshtiwari.PredatorSense" send_interface="io.github.iashutoshtiwari.PredatorSense.Control" send_member="SetGpuManualSpeed"/>
    <allow send_destination="io.github.iashutoshtiwari.PredatorSense" send_interface="io.github.iashutoshtiwari.PredatorSense.Control" send_member="SetCoolBoost"/>
    <allow send_destination="io.github.iashutoshtiwari.PredatorSense" send_interface="io.github.iashutoshtiwari.PredatorSense.Control" send_member="SetGlobalAuto"/>
    <allow send_destination="io.github.iashutoshtiwari.PredatorSense" send_interface="io.github.iashutoshtiwari.PredatorSense.Control" send_member="SetGlobalTurbo"/>
    <allow send_destination="io.github.iashutoshtiwari.PredatorSense" send_interface="org.freedesktop.DBus.Introspectable" send_member="Introspect"/>
    <allow send_destination="io.github.iashutoshtiwari.PredatorSense" send_interface="org.freedesktop.DBus.Peer" send_member="Ping"/>
  </policy>
  <policy user="root">
    <allow own="io.github.iashutoshtiwari.PredatorSense"/>
  </policy>
</busconfig>
